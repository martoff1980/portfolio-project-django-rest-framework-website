version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: railway_db_container
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - '${DB_PORT}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: railway_api_container
    ports:
      - '8000:8000'
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - DB_HOST=db
    depends_on:
      - db
    # Command runs migrations and starts the development server
    command: >
      sh -c "python manage.py wait_for_db &&
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"

volumes:
  postgres_data:
